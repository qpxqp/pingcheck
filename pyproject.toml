[project]
name = "pingcheck"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "icmplib>=3.0.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = [
    "G004",
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (sort imports)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
module = "icmplib.*"
ignore_missing_imports = true
